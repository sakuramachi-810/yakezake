@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#f5e9d6;--panel:rgba(30,20,16,.94);--accent:#ff6b5a;--btn:#3a2a22;--btn-ink:#f5e9d6;--line:#6b4b34}
}
:root[data-theme="dark"]{--ink:#f5e9d6;--panel:rgba(30,20,16,.94);--accent:#ff6b5a;--btn:#3a2a22;--btn-ink:#f5e9d6;--line:#6b4b34}
html,body{height:100%;margin:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#1b120d;overflow-x:hidden}
#bg{position:fixed;inset:-10%;z-index:0;
  background:var(--bg-image),radial-gradient(circle at 30% 20%,#ffb347 0,#b5521b 35%,#3b1d0f 100%);
  background-size:cover;background-position:center;
  filter:blur(var(--blur));transform:rotate(var(--tilt));transition:filter 1s}
#bg.sway{animation:sway 3.2s ease-in-out infinite}
#bg.s1{--bg-image:var(--bg1)}
#bg.s2{--bg-image:var(--bg2)}
#bg.s3{--bg-image:var(--bg3)}
#veil{position:fixed;inset:0;z-index:0;background:var(--veil);pointer-events:none}
@keyframes sway{0%,100%{transform:rotate(calc(var(--tilt)*-1)) scale(1.1)}50%{transform:rotate(var(--tilt)) scale(1.1)}}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 14px 40px;min-height:100%}
#app.shake{animation:shake .45s linear infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(var(--shake),calc(var(--shake)*-.6))}50%{transform:translate(calc(var(--shake)*-1),var(--shake))}75%{transform:translate(calc(var(--shake)*.6),calc(var(--shake)*.4))}}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.35)}
h1{margin:6px 0;font-size:1.7rem;text-align:center;color:#fff;text-shadow:0 2px 6px #000}
h2{margin:0 0 8px;font-size:1.15rem}
.sub{font-size:.85rem;opacity:.85;margin:2px 0 8px}
.story{font-weight:bold;color:var(--accent);margin:10px 0}
button,a.btn{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--btn);color:var(--btn-ink);border-radius:10px;padding:11px 12px;text-decoration:none;display:inline-block;text-align:center}
button:disabled{opacity:.4;cursor:not-allowed}
button.main,a.btn.main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:bold;width:100%;margin-top:8px;box-sizing:border-box}
.menu{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;text-align:left}
.price{font-weight:bold;white-space:nowrap;margin-left:8px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:bold}
.gauge{height:22px;border-radius:11px;background:rgba(0,0,0,.25);border:2px solid var(--line);overflow:hidden;margin:6px 0}
.fill{height:100%;width:0;background:linear-gradient(90deg,#f6d365,#fda085 60%,#e74c3c);transition:width .5s}
.row{display:flex;justify-content:space-between;font-size:.8rem;opacity:.8}
.log{max-height:150px;overflow:auto;font-size:.85rem;margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.title{font-size:1.5rem;font-weight:bold;color:var(--accent);text-align:center;margin:8px 0}
.over{color:#e74c3c}
li{margin:3px 0}
.hide,.modal.hide{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:5;display:flex;align-items:center;justify-content:center;padding:18px}
.phone{background:var(--panel);border:3px solid var(--accent);border-radius:18px;padding:16px;max-width:380px;width:100%;color:var(--ink)}
.msg{background:#9be08a;color:#102;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:.95rem}
.msg.mail{background:#fff;border:1px solid #bbb}
.msg.read{background:#ddd;font-size:.8rem}
</style>
</head>
<body>
<div id="bg" class="s1"></div>
<div id="veil"></div>
<div id="app">
  <h1>🍶 ひとりカス飲み大会 🍺</h1>

  <section id="start" class="card">
    <p class="story">あなたは相次ぐお祈りメールと失恋から、一人飲みをすることに決めた。</p>
    <h2>ルール</h2>
    <ul>
      <li>所持金は3000円。メニューを押して注文しよう。</li>
      <li>最大3軒ハシゴ。お会計は好きなタイミングで。</li>
      <li>泥酔度の数字は非公表。グラフと画面の揺れで察すべし。</li>
      <li>100%を超えたら「泥酔・記憶喪失」で即ゲームオーバー。</li>
      <li>お冷は0円で泥酔度−5%（各店1回だけ）。</li>
    </ul>
    <button class="main" id="go">飲みに出かける</button>
    <a class="btn main" id="sharegame" target="_blank" rel="noopener" href="#">𝕏 でこのゲームを紹介する</a>
  </section>

  <section id="game" class="hide">
    <div class="card">
      <div class="top"><span id="shopno"></span><span id="money"></span></div>
      <div class="sub" id="shopname"></div>
      <div class="gauge"><div class="fill" id="fill"></div></div>
      <div class="row"><span>🙂 シラフ</span><span id="face">🙂</span><span>泥酔 💀</span></div>
    </div>
    <div class="card">
      <div class="menu" id="menu"></div>
      <button class="main" id="bill">この店をお会計する</button>
      <div class="log" id="log"></div>
    </div>
  </section>

  <section id="next" class="card hide">
    <h2 id="nexttitle"></h2>
    <p id="nexttext"></p>
    <button class="main" id="hashigo">もう一軒ハシゴする（次の店へ）</button>
    <button class="main" id="home">満足して帰る（ゲーム終了）</button>
  </section>

  <section id="result" class="card hide"></section>
</div>

<div id="modal" class="modal hide"><div class="phone" id="phone"></div></div>

<script>
const SHOPS=[
 {n:"一軒目",s:"アーケード街にある大衆酒場",m:[
  ["レモンサワー",250,8],["プレーンサワー",200,8],["ハイボール",200,10],["生ビール",550,9],["麦焼酎",450,13],["どて焼き",400,-4],["唐揚げ",600,-8]]},
 {n:"二軒目",s:"高架下にあるディープな居酒屋",m:[
  ["多幸サワー",50,8],["巨峰サワー",150,7],["メガサワー",99,18],["メガハイボール",99,17],["瓶ビール",180,12],["マグロの造り",580,-6],["鶏皮串5本セット",450,-5]]},
 {n:"三軒目",s:"場末の知る人ぞ知る、暖簾で仕切られた居酒屋",m:[
  ["日本酒 熱燗",300,25],["テキーラ",400,39],["謎のカクテル",500,75],["謎のユッケ",600,-15],["お茶漬け",550,-20]]}
];
const $=id=>document.getElementById(id);
const GAME_URL=location.href.split("#")[0];
let S;
function init(){S={money:3000,d:0,shop:0,water:false,hist:[],ev:false,visited:1,over:false};}
function show(id){["start","game","next","result"].forEach(x=>$(x).classList.toggle("hide",x!==id));window.scrollTo(0,0);}
function effects(){
  const d=S.d,r=Math.max(0,Math.min(1,d/100));
  const root=document.documentElement.style;
  root.setProperty("--blur",(d>25?(d-25)/75*7:0).toFixed(1)+"px");
  root.setProperty("--tilt",(d>35?(d-35)/65*6:0).toFixed(1)+"deg");
  root.setProperty("--shake",(d>50?(d-50)/50*7:0).toFixed(1)+"px");
  $("bg").classList.toggle("sway",d>35);
  $("app").classList.toggle("shake",d>50);
  $("app").style.animationDuration=(0.6-r*0.3).toFixed(2)+"s";
  $("fill").style.width=Math.max(2,Math.min(100,d))+"%";
  $("face").textContent=d<20?"🙂":d<45?"😊":d<70?"🥴":d<90?"😵‍💫":"🤮";
}
function renderShop(){
  const sh=SHOPS[S.shop];
  $("bg").classList.remove("s1","s2","s3");$("bg").classList.add("s"+(S.shop+1));
  $("shopno").textContent=sh.n+"（"+(S.shop+1)+"/3）";
  $("shopname").textContent=sh.s;
  $("money").textContent="残金 "+S.money+"円";
  const menu=$("menu");menu.innerHTML="";
  sh.m.forEach(([name,price,dl])=>{
    const b=document.createElement("button");b.className="item";
    b.innerHTML="<span>"+name+"</span><span class='price'>"+price+"円</span>";
    b.disabled=price>S.money;
    b.onclick=()=>order(name,price,dl);
    menu.appendChild(b);
  });
  const w=document.createElement("button");w.className="item";
  w.innerHTML="<span>💧 お冷</span><span class='price'>0円</span>";
  w.disabled=S.water;w.onclick=()=>{S.water=true;order("お冷",0,-5);};
  menu.appendChild(w);
  effects();
}
function order(name,price,dl){
  S.money-=price;S.d=Math.max(0,S.d+dl);
  S.hist.push({shop:SHOPS[S.shop].n,name,price});
  const l=$("log");const p=document.createElement("div");
  p.textContent="・"+name+"（"+price+"円）を注文";l.prepend(p);
  if(S.d>100){S.over=true;renderShop();setTimeout(finish,700);return;}
  renderShop();
  if(S.d>80&&!S.ev){S.ev=true;setTimeout(event,500);}
}
function event(){
  const line=Math.random()<.5;
  $("phone").innerHTML=line?
   "<h2>📱 LINE（送信中…）</h2><div class='msg'>なんで断ったの？？</div><div class='msg'>既読つけて。今から行くわ。</div><div class='msg'>ねえ、ほんとに楽しみにしてたんだけど。返事は？？？？</div><div class='msg read'>既読 ✓ ←まだ付いてない</div><button class='main' id='ok'>送信してしまった…</button>":
   "<h2>✉️ メール（送信しました）</h2><div class='msg mail'><b>件名：Re: 選考結果のご連絡</b><br>株式会社◯◯ 採用ご担当者様<br><br>お祈りメール拝受しました。<br>こっちから願い下げだバーカ。<br>お元気で。</div><button class='main' id='ok'>送信してしまった…</button>";
  $("modal").classList.remove("hide");
  $("ok").onclick=()=>$("modal").classList.add("hide");
}
function bill(){
  if(S.shop<2){
    $("nexttitle").textContent=SHOPS[S.shop].n+"のお会計を済ませた";
    $("nexttext").textContent="残金 "+S.money+"円。さて、どうする？";
    show("next");
  } else finish();
}
function nextShop(){S.shop++;S.visited++;S.water=false;$("log").innerHTML="";show("game");renderShop();}
function rank(d){
  if(S.over)return"泥酔・記憶喪失";
  if(d>=85)return"最強の泥酔";
  if(d>=75)return"西でもやっていける酒カス";
  if(d>=60)return"いい飲みっぷり";
  if(d>=41)return"ただのセンベロ";
  return"ただのシラフ帰宅";
}
function finish(){
  $("modal").classList.add("hide");
  const d=Math.round(S.d),t=rank(d);
  const dd=S.over?"100%超（記憶なし）":d+"%";
  const hist=S.hist.length?S.hist.map(h=>"<li>["+h.shop+"] "+h.name+"（"+h.price+"円）</li>").join(""):"<li>何も注文せず帰宅</li>";
  const txt="【ひとりカス飲み大会】称号：「"+t+"」／泥酔度 "+dd+"／残金 "+S.money+"円／"+S.visited+"軒ハシゴ #ひとりカス飲み大会";
  const url="https://twitter.com/intent/tweet?text="+encodeURIComponent(txt)+"&url="+encodeURIComponent(GAME_URL);
  $("result").innerHTML=
   "<h2>リザルト</h2><div class='title "+(S.over?"over":"")+"'>"+t+"</div>"+
   (S.over?"<p class='sub'>気づいたら朝だった。昨夜のことは何も覚えていない。</p>":"")+
   "<p>泥酔度：<b>"+dd+"</b><br>残金：<b>"+S.money+"円</b><br>回った軒数：<b>"+S.visited+"軒</b></p>"+
   "<h2>注文履歴</h2><ul>"+hist+"</ul>"+
   "<a class='btn main' target='_blank' rel='noopener' href='"+url+"'>𝕏 で結果をポストする</a>"+
   "<button class='main' id='again'>もう一度飲む</button>";
  show("result");
  $("again").onclick=start;
}
function start(){init();$("log").innerHTML="";effects();show("game");renderShop();}
$("go").onclick=start;
$("bill").onclick=bill;
$("hashigo").onclick=nextShop;
$("home").onclick=finish;
$("sharegame").href="https://twitter.com/intent/tweet?text="+encodeURIComponent("一人飲みチキンレース『ひとりカス飲み大会』で遊んでみた！泥酔せずに3軒ハシゴできるか？ #ひとりカス飲み大会")+"&url="+encodeURIComponent(GAME_URL);
init();
</script>
</body>
</html>
